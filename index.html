<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>THT — Le verità nascoste</title>
<meta name="description" content="THT — The Hidden Truths. Le verità nascoste dell'impresa: controllo aziendale, per veri imprenditori.">
<!-- preview live: animazione «747» a fuoco + soli col raggio -->
<style>
  :root{
    --bg:#000;
    --ink:#ffffff;
    --mut:#b7bbc2;
    --gold:#e7b24e;                       /* l'oro della lampada: unico accento */
    --gutter:clamp(28px,6.2vw,92px);      /* la guida verticale sinistra */
    --logo-w:clamp(210px,20vw,320px);
    --menu-w:var(--logo-w);               /* colonna menu = larghezza ESATTA del marchio THT */
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Helvetica Neue",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }

  /* ---- HERO 100vh: la composizione approvata (nero a sinistra, lampada+fumo a destra) ---- */
  .hero{position:fixed;inset:0;overflow:hidden}
  .hero::before{
    content:"";position:absolute;inset:0;z-index:0;
    background:#000 url(assets/hero-lampada.png) no-repeat center center;
    background-size:cover;
  }
  .hero::after{                 /* velo appena percettibile: tiene il testo a sinistra sempre nitido */
    content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
    background:linear-gradient(90deg,#000 0%,#000 22%,#00000099 40%,transparent 60%);
  }
  @media (max-width:820px){
    .hero::before{background-size:auto 60vh;background-position:right bottom;opacity:.7}
    .hero::after{background:linear-gradient(180deg,#000 32%,#0000009c 62%,transparent 100%)}
  }

  /* ---- colonna sinistra ---- */
  .stage{position:relative;z-index:2;height:100%;
    display:flex;flex-direction:column;
    padding:clamp(50px,10vh,116px) var(--gutter) clamp(30px,7vh,66px);}

  .mark{width:var(--logo-w)}
  .mark img{display:block;width:100%;height:auto}   /* l'alone e' gia' nel marchio originale */

  /* payoff: OGGETTO grafico estratto (lettering grunge), non un font. Entra da protagonista,
     si posa sotto THT scalato alla larghezza esatta del marchio, resta statico. */
  .payoff{
    display:block;
    width:var(--logo-w);height:auto;
    margin-top:clamp(8px,1.5vh,17px);
    transform-origin:left center;
  }
  /* «Boeing 747»: THT fermo. Il payoff arriva DRITTO (niente diagonale), enorme come se ti
     sorvolasse da dietro: prima solo una SAGOMA sfocata (ombra/fumo), poi mette a fuoco come una
     focale, rimpicciolisce sul posto, SBATTE (contrae+flash) e si fissa nitido. */
  .payoff.animate{opacity:0;animation:payoffBoom 3.6s cubic-bezier(.38,0,.2,1) .3s forwards}
  @keyframes payoffBoom{
    0%   {opacity:0;   transform:scale(7);    filter:blur(26px) brightness(.20)}  /* sagoma enorme, indefinita, come fumo */
    9%   {opacity:.5;                          filter:blur(22px) brightness(.30)}
    58%  {opacity:.85; transform:scale(2.6);  filter:blur(8px)  brightness(.68)}  /* si avvicina e comincia a definirsi */
    82%  {opacity:1;   transform:scale(1.16); filter:blur(1.4px) brightness(1.12)} /* quasi a fuoco */
    90%  {             transform:scale(.93);  filter:blur(0)    brightness(1.8)}  /* SBATTE: impatto + flash */
    96%  {             transform:scale(1.025);filter:brightness(1.15)}
    100% {opacity:1;   transform:scale(1);    filter:brightness(1)}              /* fissato, nitido, allineato */
  }

  /* menu: 4 voci. Ogni voce = SOLE (a filo del bordo sinistro) + testo, tutto dentro il rettangolo.
     Indicatore = BARRA ILLUMINANTE (gradiente oro con alone) da bordo a bordo, compare allo sfioramento. */
  nav.menu{margin-top:clamp(38px,7.5vh,92px);display:flex;flex-direction:column;
    gap:clamp(16px,3vh,32px);width:var(--menu-w)}
  /* voce: TESTO in alto (a filo del bordo sinistro, come THT). SOTTO, a livello della sottolineatura,
     il SOLE (fermo) col centro sul bordo sinistro, e il RAGGIO che ne emana lateralmente allo sfioramento */
  .voice{position:relative;display:block;width:100%;
    padding-bottom:clamp(22px,3vh,30px);
    cursor:pointer;color:var(--ink);text-decoration:none}
  .voice .lbl{display:block;font-size:clamp(12.5px,1.05vw,15.5px);font-weight:400;letter-spacing:.17em;
    text-transform:uppercase;white-space:nowrap;transition:color .22s}
  .voice .sole{position:absolute;left:-14px;bottom:-6px;width:28px;height:28px;   /* centro sul bordo sinistro; FERMO */
    opacity:.9;filter:drop-shadow(0 0 4px #e7b24e66);transition:opacity .25s,filter .25s}
  .voice::after{content:"";position:absolute;left:6px;right:0;bottom:7px;height:2px;border-radius:2px;
    background:linear-gradient(90deg,#f4d38a,#e7b24e 30%,#e7b24e66 66%,#e7b24e00);  /* raggio dal sole, sfuma a destra */
    box-shadow:0 0 8px #e7b24e5c;opacity:0;transform:scaleX(.7);transform-origin:left;
    transition:opacity .3s,transform .38s}
  .voice:hover::after,.voice:focus-visible::after{opacity:1;transform:scaleX(1)}
  .voice:hover .sole,.voice:focus-visible .sole{opacity:1;filter:drop-shadow(0 0 11px #f4d38a)}  /* si accende, NON si muove */
  .voice:hover .lbl,.voice:focus-visible .lbl{color:#fff}
  .voice:focus-visible{outline:none}

  /* selettore lingua, in basso a sinistra sulla stessa guida */
  .langs{margin-top:auto;display:flex;align-items:center;gap:13px;font-size:13px}
  .langs button{background:none;border:0;padding:0;cursor:pointer;color:var(--mut);
    font:inherit;letter-spacing:.11em;font-weight:600;transition:color .2s}
  .langs button:hover{color:var(--ink)}
  .langs button.on{color:var(--gold)}
  .langs .sep{color:#585858}

  @media (prefers-reduced-motion:reduce){ .payoff.animate{animation:none;opacity:1} }
</style>
</head>
<body>

<div class="hero">
  <div class="stage">

    <div class="mark">
      <img src="assets/marchio-tht-logo.png" alt="THT — The Hidden Truths" width="2515" height="1404">
    </div>

    <img class="payoff animate" id="payoff" src="assets/payoff-verita-nascoste.png"
         alt="Le verità nascoste" width="345" height="42">

    <nav class="menu" aria-label="Menu principale">
      <a class="voice" data-key="imprenditori" href="imprenditori/"><img class="sole" src="assets/sole.png" width="140" height="140" alt="" aria-hidden="true"><span class="lbl">Per veri imprenditori</span></a>
      <a class="voice" data-key="controllo"    href="controllo/"><img class="sole" src="assets/sole.png" width="140" height="140" alt="" aria-hidden="true"><span class="lbl">Controllo aziendale</span></a>
      <a class="voice" data-key="segretezza"   href="segretezza/"><img class="sole" src="assets/sole.png" width="140" height="140" alt="" aria-hidden="true"><span class="lbl">Segretezza assoluta</span></a>
      <a class="voice" data-key="passo"        href="primo-passo/"><img class="sole" src="assets/sole.png" width="140" height="140" alt="" aria-hidden="true"><span class="lbl">Il primo passo</span></a>
    </nav>

    <div class="langs" aria-label="Lingua">
      <button data-lang="it" class="on">IT</button><span class="sep">|</span>
      <button data-lang="en">EN</button><span class="sep">|</span>
      <button data-lang="es">ES</button><span class="sep">|</span>
      <button data-lang="fr">FR</button>
    </div>

  </div>
</div>

<script>
  // i18n: payoff (la spiegazione del nome) + le 4 voci del menu
  const I18N = {
    it:{ payoff:"LE VERITÀ NASCOSTE", imprenditori:"Per veri imprenditori", controllo:"Controllo aziendale", segretezza:"Segretezza assoluta", passo:"Il primo passo" },
    en:{ payoff:"THE HIDDEN TRUTHS",  imprenditori:"For true entrepreneurs", controllo:"Business control",    segretezza:"Absolute confidentiality", passo:"The first step" },
    es:{ payoff:"LAS VERDADES OCULTAS", imprenditori:"Para verdaderos empresarios", controllo:"Control empresarial", segretezza:"Secreto absoluto", passo:"El primer paso" },
    fr:{ payoff:"LES VÉRITÉS CACHÉES", imprenditori:"Pour les vrais entrepreneurs", controllo:"Contrôle d'entreprise", segretezza:"Confidentialité absolue", passo:"Le premier pas" }
  };
  // Il payoff è un OGGETTO grafico (lettering grunge estratto), per ora solo IT.
  // Le versioni EN/ES/FR saranno oggetti dedicati: il cambio lingua per ora tocca solo le voci.
  function setLang(lang){
    const t = I18N[lang]; if(!t) return;
    document.documentElement.lang = lang;
    document.querySelectorAll('.voice').forEach(v=> v.querySelector('.lbl').textContent = t[v.dataset.key]);
    document.querySelectorAll('.langs button').forEach(b=> b.classList.toggle('on', b.dataset.lang===lang));
  }
  document.querySelectorAll('.langs button').forEach(b=> b.addEventListener('click',()=>setLang(b.dataset.lang)));
</script>

</body>
</html>
