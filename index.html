<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>THT — Le verità nascoste</title>
<meta name="description" content="THT — The Hidden Truths. Le verità nascoste dell'impresa: controllo aziendale, per veri imprenditori.">
<!-- preview live: cometa (scia triangolare) + atterraggio «747» dall'alto -->
<style>
  :root{
    --bg:#000;
    --ink:#ffffff;
    --mut:#b7bbc2;
    --gold:#e7b24e;                       /* l'oro della lampada: unico accento */
    --gutter:clamp(28px,6.2vw,92px);      /* la guida verticale sinistra */
    --logo-w:clamp(210px,20vw,320px);
    --menu-w:var(--logo-w);               /* colonna menu = larghezza ESATTA del marchio THT */
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Helvetica Neue",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }

  /* ---- HERO 100vh: la composizione approvata (nero a sinistra, lampada+fumo a destra) ---- */
  .hero{position:fixed;inset:0;overflow:hidden}
  .hero::before{
    content:"";position:absolute;inset:0;z-index:0;
    background:#000 url(assets/hero-lampada.png) no-repeat center center;
    background-size:cover;
  }
  .hero::after{                 /* velo appena percettibile: tiene il testo a sinistra sempre nitido */
    content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
    background:linear-gradient(90deg,#000 0%,#000 22%,#00000099 40%,transparent 60%);
  }
  @media (max-width:820px){
    .hero::before{background-size:auto 60vh;background-position:right bottom;opacity:.7}
    .hero::after{background:linear-gradient(180deg,#000 32%,#0000009c 62%,transparent 100%)}
  }

  /* ---- colonna sinistra ---- */
  .stage{position:relative;z-index:2;height:100%;
    display:flex;flex-direction:column;
    padding:clamp(50px,10vh,116px) var(--gutter) clamp(30px,7vh,66px);}

  .mark{width:var(--logo-w)}
  .mark img{display:block;width:100%;height:auto}   /* l'alone e' gia' nel marchio originale */

  /* payoff: OGGETTO grafico estratto (lettering grunge), non un font. Entra da protagonista,
     si posa sotto THT scalato alla larghezza esatta del marchio, resta statico. */
  .payoff{
    display:block;
    width:var(--logo-w);height:auto;
    margin-top:clamp(8px,1.5vh,17px);
    transform-origin:left center;
  }
  /* «Boeing 747»: THT fermo. Il payoff arriva DRITTO (niente diagonale), enorme come se ti
     sorvolasse da dietro: prima solo una SAGOMA sfocata (ombra/fumo), poi mette a fuoco come una
     focale, rimpicciolisce sul posto, SBATTE (contrae+flash) e si fissa nitido. */
  .payoff.animate{opacity:0;animation:payoffBoom 4.6s cubic-bezier(.52,0,.14,1) .2s forwards}
  @keyframes payoffBoom{
    0%   {opacity:0;   transform:translate(2vw,-36vh) scale(26); filter:blur(54px) brightness(1.5)}  /* GIGANTE sopra/alle spalle: solo il "rombo", non capisci cos'è */
    5%   {opacity:.86; transform:translate(2vw,-34vh) scale(25); filter:blur(50px) brightness(1.5)}  /* c'è, enorme, presente */
    38%  {opacity:.92; transform:translate(1.5vw,-17vh) scale(9.5);filter:blur(30px) brightness(1.3)}/* SCENDE DRITTO, ancora gigantesco */
    68%  {opacity:1;   transform:translate(1vw,-5vh)   scale(2.6); filter:blur(10px) brightness(1.15)}/* si materializza dalla nebbia */
    84%  {             transform:translate(0,0)        scale(1.12);filter:blur(1px)  brightness(1.08)}
    90%  {             transform:translate(0,0)        scale(.88); filter:blur(0)    brightness(2.1)} /* SI STAMPA: impatto + flash */
    95%  {             transform:translate(0,0)        scale(1.03);filter:brightness(1.2)}
    100% {opacity:1;   transform:translate(0,0)        scale(1);   filter:brightness(1)}              /* fissato, nitido, allineato */
  }

  /* menu: 4 voci. Ogni voce = SOLE (a filo del bordo sinistro) + testo, tutto dentro il rettangolo.
     Indicatore = BARRA ILLUMINANTE (gradiente oro con alone) da bordo a bordo, compare allo sfioramento. */
  nav.menu{margin-top:clamp(34px,6.8vh,84px);display:flex;flex-direction:column;
    gap:clamp(24px,4.2vh,44px);width:var(--menu-w)}   /* più aria FRA le voci: l'underline resta con la SUA */
  /* voce: TESTO giustificato nella colonna. Appena SOTTO (~1-2mm) la sottolineatura = un solo oggetto:
     una piccola STELLA-sorgente sotto la prima lettera, da cui NASCE il raggio (stesso oro, più brillante). */
  .voice{position:relative;display:block;width:100%;
    padding-bottom:clamp(24px,3.4vh,30px);   /* spazio per la testa della cometa sotto il testo */
    cursor:pointer;color:var(--ink);text-decoration:none}
  .voice .lbl{display:block;width:100%;font-size:clamp(12.5px,1.05vw,15.5px);font-weight:400;letter-spacing:.17em;
    text-transform:uppercase;white-space:nowrap;transition:color .22s}
  /* STELLA COMETA: testa (sole) più grande + SCIA TRIANGOLARE che si assottiglia e sfuma verso la fine */
  .voice .sole{position:absolute;left:-15px;bottom:-2px;width:40px;height:40px;   /* testa della cometa, sotto la 1a lettera; FERMA */
    opacity:.96;filter:drop-shadow(0 0 6px #e7b24e8f);transition:opacity .25s,filter .25s}
  .voice::after{content:"";position:absolute;left:0;right:0;bottom:13px;height:10px;   /* scia: centro (18px)=centro cometa */
    background:linear-gradient(90deg,#fff4d6 0%,#f4d38a 12%,#e7b24e 40%,#e7b24e00 100%);  /* pickup oro, luminosa alla testa, sfuma verso la fine */
    clip-path:polygon(0 0,100% 50%,0 100%);   /* TRIANGOLO: base alla testa, punta alla fine delle parole */
    filter:blur(.5px);opacity:0;transform:scaleX(.5);transform-origin:left;
    transition:opacity .28s,transform .46s cubic-bezier(.2,.7,.2,1)}
  .voice:hover::after,.voice:focus-visible::after{opacity:1;transform:scaleX(1)}   /* il raggio scatta fuori dal sole */
  .voice:hover .sole,.voice:focus-visible .sole{opacity:1;filter:drop-shadow(0 0 8px #fff4d6) drop-shadow(0 0 4px #f4d38a)}  /* il sole si ACCENDE (sorgente), NON si muove */
  .voice:hover .lbl,.voice:focus-visible .lbl{color:#fff}
  .voice:focus-visible{outline:none}

  /* blocco in basso a sinistra: lingue + footer legale minimo */
  .bottom{margin-top:auto;display:flex;flex-direction:column;gap:clamp(11px,1.6vh,18px)}
  .langs{display:flex;align-items:center;gap:13px;font-size:13px}
  .langs button{background:none;border:0;padding:0;cursor:pointer;color:var(--mut);
    font:inherit;letter-spacing:.11em;font-weight:600;transition:color .2s}
  .langs button:hover{color:var(--ink)}
  .langs button.on{color:var(--gold)}
  .langs .sep{color:#585858}
  /* footer legale: microscopico e defilato (solo P.IVA visibile + link alle pagine dedicate) */
  .legal{font-size:clamp(9.5px,.72vw,11px);color:#6b7079;letter-spacing:.02em;line-height:1.6;max-width:560px}
  .legal a{color:#878d96;text-decoration:none;transition:color .2s}
  .legal a:hover{color:var(--gold)}
  .legal .sep{color:#3f434a;padding:0 3px}
  .legal .piva{color:#878d96}

  @media (prefers-reduced-motion:reduce){ .payoff.animate{animation:none;opacity:1} }
</style>
</head>
<body>

<div class="hero">
  <div class="stage">

    <div class="mark">
      <img src="assets/marchio-tht-logo.png" alt="THT — The Hidden Truths" width="2515" height="1404">
    </div>

    <img class="payoff animate" id="payoff" src="assets/payoff-verita-nascoste.png"
         alt="Le verità nascoste" width="345" height="42">

    <nav class="menu" aria-label="Menu principale">
      <a class="voice" data-key="imprenditori" href="imprenditori/"><img class="sole" src="assets/sole.png" width="140" height="140" alt="" aria-hidden="true"><span class="lbl">Per veri imprenditori</span></a>
      <a class="voice" data-key="controllo"    href="controllo/"><img class="sole" src="assets/sole.png" width="140" height="140" alt="" aria-hidden="true"><span class="lbl">Controllo aziendale</span></a>
      <a class="voice" data-key="segretezza"   href="segretezza/"><img class="sole" src="assets/sole.png" width="140" height="140" alt="" aria-hidden="true"><span class="lbl">Segretezza assoluta</span></a>
      <a class="voice" data-key="passo"        href="primo-passo/"><img class="sole" src="assets/sole.png" width="140" height="140" alt="" aria-hidden="true"><span class="lbl">Il primo passo</span></a>
    </nav>

    <div class="bottom">
      <div class="langs" aria-label="Idioma">
        <button data-lang="it" class="on">IT</button><span class="sep">|</span>
        <button data-lang="en">EN</button><span class="sep">|</span>
        <button data-lang="es">ES</button><span class="sep">|</span>
        <button data-lang="fr">FR</button>
      </div>
      <div class="legal">
        © 2026 THT — The Hidden Truths<span class="sep">·</span><span class="piva">P. IVA ⟨da inserire⟩</span><span class="sep">·</span><a href="privacy/">Privacy</a><span class="sep">·</span><a href="cookie/">Cookie</a><span class="sep">·</span><a href="note-legali/">Note legali</a><span class="sep">·</span><a href="contatti/">Contatti</a>
      </div>
    </div>

  </div>
</div>

<script>
  // i18n: payoff (la spiegazione del nome) + le 4 voci del menu
  const I18N = {
    it:{ payoff:"LE VERITÀ NASCOSTE", imprenditori:"Per veri imprenditori", controllo:"Controllo aziendale", segretezza:"Segretezza assoluta", passo:"Il primo passo" },
    en:{ payoff:"THE HIDDEN TRUTHS",  imprenditori:"For true entrepreneurs", controllo:"Business control",    segretezza:"Absolute confidentiality", passo:"The first step" },
    es:{ payoff:"LAS VERDADES OCULTAS", imprenditori:"Para verdaderos empresarios", controllo:"Control empresarial", segretezza:"Secreto absoluto", passo:"El primer paso" },
    fr:{ payoff:"LES VÉRITÉS CACHÉES", imprenditori:"Pour les vrais entrepreneurs", controllo:"Contrôle d'entreprise", segretezza:"Confidentialité absolue", passo:"Le premier pas" }
  };
  // Il payoff è un OGGETTO grafico (lettering grunge estratto), per ora solo IT.
  // Le versioni EN/ES/FR saranno oggetti dedicati: il cambio lingua per ora tocca solo le voci.
  // giustifica ogni voce nella colonna ESATTA del marchio (letter-spacing calcolato, come il payoff)
  function fitVoices(){
    const img=document.querySelector('.mark img'); if(!img) return;
    const colW=img.getBoundingClientRect().width;
    document.querySelectorAll('.voice .lbl').forEach(el=>{
      const len=el.textContent.length; if(len<2) return;
      el.style.letterSpacing='0px'; el.style.display='inline-block'; el.style.width='auto';
      const nat=el.getBoundingClientRect().width;                 // larghezza naturale del testo
      el.style.display=''; el.style.width='';                     // torna block width:100%
      el.style.letterSpacing=Math.max(0,(colW-nat)/(len-1))+'px'; // riempie la colonna, flush ai due bordi
    });
  }

  function setLang(lang){
    const t = I18N[lang]; if(!t) return;
    document.documentElement.lang = lang;
    document.querySelectorAll('.voice').forEach(v=> v.querySelector('.lbl').textContent = t[v.dataset.key]);
    document.querySelectorAll('.langs button').forEach(b=> b.classList.toggle('on', b.dataset.lang===lang));
    fitVoices();
  }
  document.querySelectorAll('.langs button').forEach(b=> b.addEventListener('click',()=>setLang(b.dataset.lang)));

  (document.fonts?document.fonts.ready:Promise.resolve()).then(fitVoices);
  let _rzv; addEventListener('resize',()=>{clearTimeout(_rzv);_rzv=setTimeout(fitVoices,120);});
</script>

</body>
</html>
