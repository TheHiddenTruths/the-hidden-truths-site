<!DOCTYPE html>

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>System Lab — Synopsis</title>
<style>
  :root{--bg:#0a0b0d;--panel:#111418;--ink:#e9ecef;--muted:#dfe2e6;--faint:#b9bdc4;
    --line:#252b32;--gold:#e0b03a;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--mono);
    display:flex;flex-direction:column;min-height:100vh}
  header{display:flex;align-items:center;gap:16px;padding:14px 20px;
    border-bottom:1px solid var(--line);background:linear-gradient(180deg,#0c0e11,var(--bg))}
  .tag{font-size:22px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
    color:var(--gold);border:1px solid var(--line);padding:7px 16px;border-radius:14px}
  .title{font-family:var(--sans);font-weight:750;font-size:18px;margin-left:22px}
  .title .sub{color:var(--muted);font-weight:500;font-size:13px;font-family:var(--mono);margin-left:8px}
  .spacer{margin-left:auto}
  .close{display:inline-flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--muted);text-decoration:none;border:1px solid var(--line);
    padding:8px 14px;border-radius:22px;background:var(--panel);cursor:pointer}
  .close:hover{color:var(--ink);border-color:var(--gold)}
  main{flex:1;display:flex;padding:22px;min-height:0}
  .canvas{flex:1;border:1px solid var(--line);border-radius:16px;background:#f1efe8;
    position:relative;overflow:auto;
    background-image:linear-gradient(rgba(48,42,32,.08) 1px,transparent 1px),
      linear-gradient(90deg,rgba(48,42,32,.08) 1px,transparent 1px);background-size:40px 40px}
  .canvas svg{display:block;min-width:1100px}
  .demo-badge{position:absolute;top:12px;right:16px;z-index:5;font-size:12px;letter-spacing:.24em;
    color:#0a0b0d;background:var(--gold);padding:5px 12px;border-radius:12px;font-weight:700}
  footer{padding:12px 20px;border-top:1px solid var(--line);color:var(--faint);
    font-size:11.5px;display:flex;gap:14px;flex-wrap:wrap}
  footer .r{margin-left:auto}
  @media (max-width:640px){ .title .sub{display:none} main{padding:12px} }
</style>
</head>
