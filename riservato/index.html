<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>THT — Accesso Riservato</title>
<!--
  COCKPIT RISERVATO di THT (plancia di Stefano) — struttura v0.
  MODELLO A 3 LAYER (come i prodotti):
    L1 = questo cancello (accesso riservato, password SOFT — solo deterrente).
    L2 = il menu delle FAMIGLIE di controllo (Architettura, Attività, Cruscotto, Finanziario, Fiscale).
    L3 = il singolo pannello.
  SICUREZZA (regola #23): la password NON protegge davvero (sito pubblico = codice visibile).
  Percio' i DATI PRIVATI (finanziari/fiscali) NON si committano mai qui: vivono in localStorage,
  nel browser di Stefano. Questa struttura non contiene un solo numero reale di Stefano.
  "Connesso al repository": i pannelli non-sensibili (Attività, Cruscotto) leggeranno i dati
  pubblici del repo (da-fare.json, avanzamento.json) quando saranno esposti in /site; i pannelli
  sensibili leggono solo localStorage.
-->
<style>
  :root{
    --bg:#0b0c0e; --panel:#141619; --panel2:#1b1e22; --line:#2a2e34;
    --ink:#e9ecef; --muted:#9aa1ab; --faint:#6b727c; --gold:#c9b48a;
    --ok:#7fb98a; --wait:#d9b06a; --todo:#c98a8a; --accent:#6586A7;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans)}

  /* --- L1: cancello --- */
  #gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 30%,#16191d,#0b0c0e);z-index:100}
  #gate .box{width:min(360px,88vw);text-align:center}
  #gate .logo{font-weight:800;letter-spacing:.14em;font-size:26px}
  #gate .logo small{display:block;font-weight:500;letter-spacing:.3em;font-size:11px;color:var(--muted);margin-top:4px}
  #gate .lab{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin:26px 0 12px}
  #gate input{width:100%;padding:12px 14px;background:var(--panel);border:1px solid var(--line);
    border-radius:10px;color:var(--ink);font-size:18px;text-align:center;letter-spacing:.3em;font-family:var(--mono)}
  #gate input:focus{outline:none;border-color:var(--gold)}
  #gate button{margin-top:12px;width:100%;padding:12px;border:0;border-radius:10px;background:var(--gold);
    color:#1a1a1a;font-weight:700;font-size:15px;cursor:pointer}
  #gate .err{color:var(--todo);font-size:13px;height:18px;margin-top:10px;font-family:var(--mono)}

  /* --- cockpit --- */
  #cockpit{display:none;min-height:100vh}
  header.top{display:flex;align-items:center;gap:14px;padding:14px 20px;border-bottom:1px solid var(--line);
    position:sticky;top:0;background:rgba(11,12,14,.9);backdrop-filter:blur(6px);z-index:20}
  header.top .t{font-weight:700;letter-spacing:.02em}
  header.top .who{font-family:var(--mono);font-size:12px;color:var(--muted);margin-left:auto}
  header.top .out{font-family:var(--mono);font-size:12px;color:var(--faint);cursor:pointer;border:1px solid var(--line);
    padding:5px 10px;border-radius:8px}
  .wrap{display:grid;grid-template-columns:230px 1fr;gap:0;min-height:calc(100vh - 55px)}
  @media(max-width:720px){.wrap{grid-template-columns:1fr}}

  /* L2: menu famiglie */
  nav.fam{border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:6px}
  @media(max-width:720px){nav.fam{flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line)}}
  nav.fam .lab{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);padding:0 8px 4px}
  nav.fam button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:1px solid transparent;
    color:var(--muted);padding:10px 12px;border-radius:9px;cursor:pointer;font-size:14px;font-family:var(--sans)}
  nav.fam button:hover{background:var(--panel)}
  nav.fam button.on{background:var(--panel);border-color:var(--line);color:var(--ink)}
  nav.fam button .em{width:18px;text-align:center}

  /* L3: pannello */
  main.panel{padding:22px 26px}
  .ph{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin:0 0 4px}
  h1{font-size:22px;margin:0 0 4px;font-weight:650}
  .sub{color:var(--muted);font-size:14px;margin:0 0 20px}
  .todo-note{background:var(--panel);border:1px dashed var(--line);border-radius:10px;padding:16px 18px;color:var(--muted);font-size:14px}
  .todo-note b{color:var(--ink)}

  /* pannello Architettura (interattivo) */
  .filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
  .filters .grp{display:flex;gap:6px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 8px}
  .filters .glab{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-right:4px}
  .chip{font-family:var(--mono);font-size:12px;padding:5px 10px;border-radius:16px;border:1px solid var(--line);color:var(--muted);cursor:pointer;user-select:none}
  .chip.on{border-color:var(--gold);color:var(--ink)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
  .cmp{background:var(--panel);border:1px solid var(--line);border-left-width:4px;border-radius:10px;padding:12px 14px}
  .cmp .n{font-size:14px;font-weight:600}
  .cmp .m{font-family:var(--mono);font-size:11px;color:var(--faint);margin-top:3px;display:flex;justify-content:space-between}
  .cmp[data-stato="reale"]{border-left-color:var(--ok)}
  .cmp[data-stato="roadmap"]{border-left-color:var(--wait)}
  .cmp[data-stato="design"]{border-left-color:var(--todo)}
  .cmp .st{text-transform:uppercase;letter-spacing:.06em}
  .cmp[data-stato="reale"] .st{color:var(--ok)}
  .cmp[data-stato="roadmap"] .st{color:var(--wait)}
  .cmp[data-stato="design"] .st{color:var(--todo)}
  .count{font-family:var(--mono);font-size:12px;color:var(--muted);margin-bottom:10px}
</style>
</head>
<body>

<!-- L1 · CANCELLO -->
<div id="gate">
  <div class="box">
    <div class="logo">THT<small>THE HIDDEN TRUTHS</small></div>
    <div class="lab">Accesso Riservato</div>
    <input id="pw" type="password" inputmode="numeric" autocomplete="off" placeholder="••••" aria-label="Password">
    <button id="enter">Entra</button>
    <div class="err" id="err"></div>
  </div>
</div>

<!-- COCKPIT -->
<div id="cockpit">
  <header class="top">
    <span class="t">THT — Cockpit di Comando</span>
    <span class="who">Area Riservata · Stefano</span>
    <span class="out" id="logout">Esci</span>
  </header>
  <div class="wrap">
    <nav class="fam">
      <div class="lab">Famiglie di controllo</div>
      <button data-fam="architettura" class="on"><span class="em">🗺️</span> Architettura</button>
      <button data-fam="attivita"><span class="em">✅</span> Attività</button>
      <button data-fam="cruscotto"><span class="em">🎛️</span> Cruscotto</button>
      <button data-fam="finanziario"><span class="em">💶</span> Finanziario</button>
      <button data-fam="fiscale"><span class="em">🧾</span> Fiscale</button>
    </nav>
    <main class="panel" id="panel"></main>
  </div>
</div>

<script>
/* ---- password SOFT (deterrente, non serratura). Cambiala qui in una riga. ---- */
var PASSWORD = "9369";
var gate=document.getElementById('gate'), cockpit=document.getElementById('cockpit');
function unlock(){gate.style.display='none';cockpit.style.display='block';localStorage.setItem('tht_riservato','1');render('architettura');}
function tryPw(){var v=document.getElementById('pw').value.trim();
  if(v===PASSWORD){unlock();}else{document.getElementById('err').textContent='Codice errato.';}}
document.getElementById('enter').onclick=tryPw;
document.getElementById('pw').addEventListener('keydown',function(e){if(e.key==='Enter')tryPw();});
document.getElementById('logout').onclick=function(){localStorage.removeItem('tht_riservato');location.reload();};
if(localStorage.getItem('tht_riservato')==='1'){unlock();}

/* ---- L2 menu ---- */
document.querySelectorAll('nav.fam button').forEach(function(b){
  b.onclick=function(){document.querySelectorAll('nav.fam button').forEach(function(x){x.classList.remove('on');});
    b.classList.add('on');render(b.dataset.fam);};
});

/* ---- dati Architettura (dal MASTER-CHART: stato reale/roadmap/design per componente) ---- */
var COMPONENTI=[
  {n:"Motore Fast (engine.js)",strato:"motori",stato:"reale",nota:"161/161"},
  {n:"Motore Instant",strato:"motori",stato:"roadmap",nota:"in costruzione"},
  {n:"Motore Full",strato:"motori",stato:"roadmap",nota:"dai sorgenti"},
  {n:"Calculation · KPI · Diagnostic",strato:"motori",stato:"design",nota:"libreria"},
  {n:"Scoring · Threshold · Risk",strato:"motori",stato:"design",nota:"libreria"},
  {n:"Mask Fast",strato:"interfaccia",stato:"reale",nota:""},
  {n:"Mask Instant",strato:"interfaccia",stato:"reale",nota:"senza motore"},
  {n:"Dossier Fast",strato:"interfaccia",stato:"reale",nota:""},
  {n:"Sito landing",strato:"interfaccia",stato:"reale",nota:"parziale"},
  {n:"Sito a 3 layer (scroll)",strato:"interfaccia",stato:"roadmap",nota:""},
  {n:"Dossier Instant · Full",strato:"interfaccia",stato:"roadmap",nota:"placeholder"},
  {n:"JSON scaricabili",strato:"dati",stato:"reale",nota:"nessun backend"},
  {n:"Database (PostgreSQL)",strato:"dati",stato:"roadmap",nota:"il ponte"},
  {n:"GitHub + Pages",strato:"infra",stato:"reale",nota:"deploy sito"},
  {n:"Docker · VPS · Backend",strato:"infra",stato:"roadmap",nota:""},
  {n:"Stripe · Squarespace · Cloudflare",strato:"servizi",stato:"roadmap",nota:""},
  {n:"LLM API (OpenAI, Claude)",strato:"servizi",stato:"roadmap",nota:"no dati personali"}
];
var fStato={reale:true,roadmap:true,design:true};
var fStrato={motori:true,interfaccia:true,dati:true,infra:true,servizi:true};

function panelArchitettura(){
  var strati=[["motori","Motori"],["interfaccia","Interfaccia"],["dati","Dati"],["infra","Infra"],["servizi","Servizi"]];
  var stati=[["reale","Reale"],["roadmap","Roadmap"],["design","Design"]];
  var h='<p class="ph">Famiglia · Architettura</p><h1>Componentistica del sistema</h1>'
    +'<p class="sub">Accendi/spegni per stato e per strato. Verde = reale · ambra = roadmap · rosso = design. Sfondo: qui andrà la nuova chart.</p>';
  h+='<div class="filters"><div class="grp"><span class="glab">Stato</span>'
    +stati.map(function(s){return '<span class="chip '+(fStato[s[0]]?'on':'')+'" data-t="stato" data-k="'+s[0]+'">'+s[1]+'</span>';}).join('')+'</div>';
  h+='<div class="grp"><span class="glab">Strato</span>'
    +strati.map(function(s){return '<span class="chip '+(fStrato[s[0]]?'on':'')+'" data-t="strato" data-k="'+s[0]+'">'+s[1]+'</span>';}).join('')+'</div></div>';
  var vis=COMPONENTI.filter(function(c){return fStato[c.stato]&&fStrato[c.strato];});
  h+='<div class="count">'+vis.length+' componenti visibili</div><div class="grid">';
  h+=vis.map(function(c){return '<div class="cmp" data-stato="'+c.stato+'"><div class="n">'+c.n+'</div>'
    +'<div class="m"><span>'+c.strato+'</span><span class="st">'+c.stato+(c.nota?' · '+c.nota:'')+'</span></div></div>';}).join('');
  h+='</div>';
  document.getElementById('panel').innerHTML=h;
  document.querySelectorAll('.chip').forEach(function(ch){ch.onclick=function(){
    var t=ch.dataset.t,k=ch.dataset.k;if(t==='stato')fStato[k]=!fStato[k];else fStrato[k]=!fStrato[k];panelArchitettura();};});
}

function placeholder(ph,titolo,sub,nota){
  document.getElementById('panel').innerHTML='<p class="ph">'+ph+'</p><h1>'+titolo+'</h1><p class="sub">'+sub+'</p>'
    +'<div class="todo-note">'+nota+'</div>';
}

function render(fam){
  if(fam==='architettura')return panelArchitettura();
  if(fam==='attivita')return placeholder('Famiglia · Attività','Le cose aperte',
    'I 45 punti del promemoria, filtrabili per priorità.',
    '<b>Da collegare</b> al repo: leggerà <code>da-fare.json</code> (i punti) quando sarà esposto in /site. Dato non sensibile → può stare nel repo.');
  if(fam==='cruscotto')return placeholder('Famiglia · Cruscotto','La spia della benzina',
    'TRE Score, riserva tasse, cuscinetto, pareggio OÜ, tetto 85k, semaforo Fase 2.',
    '<b>Da collegare</b>: i numeri di stato vivono in <b>localStorage</b> (privati) — mai committati nel repo pubblico.');
  if(fam==='finanziario')return placeholder('Famiglia · Finanziario','Ricavi, riserve, flussi',
    'Conti, accantonamenti, flusso di cassa personale.',
    '<b>Dati sensibili → SOLO localStorage.</b> Nessun numero finanziario di Stefano finisce mai nel repo pubblico (regola #23).');
  if(fam==='fiscale')return placeholder('Famiglia · Fiscale','Imposte, soglie, scadenze',
    'Tetto forfettario 85k, riserva tasse, scadenze fiscali.',
    '<b>Dati sensibili → SOLO localStorage.</b> Il cockpit calcola in locale, non pubblica nulla.');
}
</script>
</body>
</html>
