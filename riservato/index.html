<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>THT — Cockpit di Comando</title>
<!--
  COCKPIT DI SVILUPPO v1 — la GUI operativa (non un poster).
  Comanda, non racconta: LED + pulsanti + numeri, quasi niente testo.
  I dati sono OGGI incorporati (baked) dal registro stato-componenti.json e da git log,
  cosi' funziona anche in anteprima. Prossimo passo: rigenerarli a ogni commit (build).
  SICUREZZA #23: password soft (deterrente); nessun dato sensibile qui.
-->
<style>
  :root{
    --bg:#0a0b0d; --panel:#111418; --panel2:#171b20; --line:#252b32;
    --ink:#e9ecef; --muted:#9aa1ab; --faint:#666d76; --gold:#c9b48a;
    --verde:#3fb765; --giallo:#e0b03a; --rosso:#d0574f; --grigio:#5a636e; --blu:#6586A7;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(circle at 50% -10%,#14181d,#0a0b0d 60%);color:var(--ink);font-family:var(--sans)}

  /* gate */
  #gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:100}
  #gate .box{width:min(340px,86vw);text-align:center}
  #gate .logo{font-weight:800;letter-spacing:.16em;font-size:26px}
  #gate .logo small{display:block;font-weight:600;letter-spacing:.34em;font-size:10px;color:var(--muted);margin-top:5px}
  #gate .lab{font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin:24px 0 12px}
  #gate input{width:100%;padding:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--ink);font-size:20px;text-align:center;letter-spacing:.4em;font-family:var(--mono)}
  #gate input:focus{outline:none;border-color:var(--gold)}
  #gate button{margin-top:12px;width:100%;padding:12px;border:0;border-radius:10px;background:var(--gold);color:#191919;font-weight:700;font-size:15px;cursor:pointer}
  #gate .err{color:var(--rosso);font-size:12px;height:16px;margin-top:9px;font-family:var(--mono)}

  #cockpit{display:none;max-width:1100px;margin:0 auto;padding:16px}

  /* header strumenti */
  .hdr{display:flex;align-items:center;gap:14px;padding:12px 16px;background:linear-gradient(#141821,#0e1116);
    border:1px solid var(--line);border-radius:14px}
  .hdr .brand{font-weight:800;letter-spacing:.14em;font-size:18px}
  .hdr .brand small{font-weight:600;letter-spacing:.3em;font-size:8px;color:var(--muted);display:block}
  .stat{display:flex;gap:18px;margin-left:auto;align-items:center}
  .stat .cell{text-align:center;font-family:var(--mono)}
  .stat .cell .k{font-size:9px;letter-spacing:.12em;color:var(--faint);text-transform:uppercase}
  .stat .cell .v{font-size:15px;font-weight:700}
  .stat .v.on{color:var(--verde)} .stat .v.warn{color:var(--giallo)}
  .out{font-family:var(--mono);font-size:11px;color:var(--faint);cursor:pointer;border:1px solid var(--line);padding:6px 10px;border-radius:8px}

  /* selettore prodotto */
  .mode{display:flex;gap:8px;margin-top:14px}
  .mode button{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;color:var(--muted);font-family:var(--sans)}
  .mode button .n{font-size:17px;font-weight:700;letter-spacing:.02em}
  .mode button .d{font-size:11px;color:var(--faint)}
  .mode button.on{border-color:var(--gold);color:var(--ink);box-shadow:inset 0 0 24px rgba(201,180,138,.08)}
  .mode button .led{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}

  /* riga strumenti: gauge + comandi */
  .row{display:grid;grid-template-columns:150px 150px 1fr;gap:12px;margin-top:14px}
  @media(max-width:680px){.row{grid-template-columns:1fr 1fr}}
  .gauge{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
  .gauge .k{font-family:var(--mono);font-size:9px;letter-spacing:.12em;color:var(--faint);text-transform:uppercase}
  .gauge svg{display:block;margin:4px auto 0}
  .gauge .big{font-size:22px;font-weight:800;font-family:var(--mono)}
  .cmds{display:flex;flex-direction:column;gap:8px;justify-content:center}
  .cmd{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;color:var(--ink);text-align:left;font-family:var(--sans);font-size:14px;font-weight:600}
  .cmd:hover{border-color:var(--gold)}
  .cmd .ic{font-size:17px}
  .cmd .badge{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--gold);background:color-mix(in srgb,var(--gold) 14%,transparent);padding:2px 8px;border-radius:20px}

  /* LED grid */
  .grid-t{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--faint);text-transform:uppercase;margin:18px 4px 8px}
  .leds{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
  .led-c{display:flex;align-items:center;gap:9px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
  .dot{width:11px;height:11px;border-radius:50%;flex:none;box-shadow:0 0 8px currentColor}
  .dot.verde{background:var(--verde);color:var(--verde)} .dot.giallo{background:var(--giallo);color:var(--giallo)}
  .dot.rosso{background:var(--rosso);color:var(--rosso)} .dot.grigio{background:var(--grigio);color:transparent;box-shadow:none}
  .led-c .nm{font-size:13px} .led-c .st{margin-left:auto;font-family:var(--mono);font-size:9px;color:var(--faint);text-transform:uppercase}

  .legend{display:flex;gap:16px;margin:14px 4px 0;font-family:var(--mono);font-size:11px;color:var(--muted);flex-wrap:wrap}
  .legend span{display:flex;align-items:center;gap:6px}
  .legend .dot{width:9px;height:9px}

  /* modale */
  .modal{position:fixed;inset:0;background:rgba(6,7,9,.72);display:none;align-items:center;justify-content:center;z-index:60;padding:18px}
  .modal .card{background:var(--panel2);border:1px solid var(--line);border-radius:16px;max-width:560px;width:100%;max-height:80vh;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:20px}
  .modal h3{margin:0 0 4px;font-size:17px}
  .modal .sub{color:var(--muted);font-size:12px;margin:0 0 14px;font-family:var(--mono)}
  .modal ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
  .modal li{font-size:13px;background:var(--panel);border:1px solid var(--line);border-left-width:3px;border-radius:8px;padding:9px 12px;display:flex;gap:8px;align-items:baseline}
  .modal li .hash{font-family:var(--mono);color:var(--gold);font-size:11px}
  .modal li .dt{font-family:var(--mono);color:var(--faint);font-size:11px;margin-left:auto;flex:none}
  .modal .x{float:right;cursor:pointer;color:var(--faint);border:1px solid var(--line);border-radius:8px;padding:3px 9px;font-family:var(--mono);font-size:12px}
  .foot{font-family:var(--mono);font-size:10px;color:var(--faint);text-align:center;margin:22px 0 6px}

  /* ---- passata estetica «cruscotto d'aereo» (vetro · ghiere · glow) ---- */
  body{background:
    radial-gradient(1200px 500px at 50% -20%, rgba(101,134,167,.10), transparent 60%),
    radial-gradient(circle at 50% 120%, #0e1319, #07080a 70%);}
  #cockpit::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;
    background:repeating-linear-gradient(0deg, rgba(255,255,255,.012) 0 1px, transparent 1px 3px);}
  .hdr,.gauge,.led-c,.cmd,.mode button,.modal .card{
    background:linear-gradient(180deg,#181d24,#0f1318);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.05), inset 0 0 24px rgba(0,0,0,.35), 0 2px 6px rgba(0,0,0,.4);
    border-color:#20262e;}
  .hdr{border-radius:16px;box-shadow:inset 0 1px 0 rgba(255,255,255,.06), 0 4px 18px rgba(0,0,0,.5)}
  .dot{box-shadow:0 0 10px currentColor, 0 0 3px currentColor, inset 0 -1px 2px rgba(0,0,0,.4)}
  .dot.verde{animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 6px var(--verde),0 0 2px var(--verde)}50%{box-shadow:0 0 14px var(--verde),0 0 5px var(--verde)}}
  .gauge{border-radius:16px}
  .mode button.on{box-shadow:inset 0 0 30px rgba(201,180,138,.14), inset 0 1px 0 rgba(255,255,255,.06)}
  .cmd .ic{filter:drop-shadow(0 0 6px rgba(208,87,79,.5))}
  @media (prefers-reduced-motion:reduce){.dot.verde{animation:none}}
</style>
</head>
<body>

<div id="gate"><div class="box">
  <div class="logo">THT<small>SYSTEMS</small></div>
  <div class="lab">Accesso Riservato</div>
  <input id="pw" type="text" inputmode="numeric" autocomplete="off" placeholder="inserisci il codice" aria-label="Codice">
  <button id="enter">Entra ▸</button>
  <div class="err" id="err"></div>
</div></div>

<div id="cockpit">
  <div class="hdr">
    <div class="brand">THT<small>SYSTEMS · COCKPIT</small></div>
    <div class="stat">
      <div class="cell"><div class="k">Sistema</div><div class="v warn" id="s-sys">IN SVILUPPO</div></div>
      <div class="cell"><div class="k">Verdi</div><div class="v on" id="s-verdi">7/18</div></div>
      <div class="cell"><div class="k">Da fare</div><div class="v warn" id="s-todo">46</div></div>
      <div class="cell"><div class="k">Ultimo</div><div class="v" id="s-last">00:23</div></div>
    </div>
    <a class="out" href="../" style="text-decoration:none;margin-right:8px">◂ Torna al sito</a>
    <span class="out" id="logout">Esci</span>
  </div>

  <div class="mode" id="mode"></div>

  <div class="row">
    <div class="gauge"><div class="k">% Implementato</div><div id="g1"></div></div>
    <div class="gauge"><div class="k">Motori reali</div><div id="g2"></div></div>
    <div class="cmds">
      <button class="cmd" id="btn-manca"><span class="ic">🔴</span> Nodi da risolvere <span class="badge" id="b-manca">…</span></button>
      <button class="cmd" id="btn-lavoro"><span class="ic">🕒</span> Registro attività <span class="badge">8</span></button>
    </div>
  </div>

  <div class="grid-t">Componenti — stato reale</div>
  <div class="leds" id="leds"></div>

  <div class="legend">
    <span><i class="dot verde"></i> attivo</span>
    <span><i class="dot giallo"></i> dormiente</span>
    <span><i class="dot rosso"></i> da costruire</span>
    <span><i class="dot grigio"></i> n/a</span>
  </div>
  <div class="foot">THT SYSTEMS · cockpit di sviluppo v1 · i LED dicono il vero, non l'aspirazione</div>
</div>

<div class="modal" id="modal"><div class="card">
  <span class="x" id="mx">chiudi</span>
  <h3 id="m-title"></h3><p class="sub" id="m-sub"></p>
  <ul id="m-list"></ul>
</div></div>

<script>
var PASSWORD="9369";
/* --- dati incorporati (baked dal registro + git log) --- */
var COMPONENTI=[
 {n:"Motore Fast",s:"verde",strato:"motori",nota:"161/161"},
 {n:"Motore Instant",s:"giallo",strato:"motori",nota:"mask sì, motore no"},
 {n:"Motore Full",s:"rosso",strato:"motori",nota:"solo sorgenti"},
 {n:"Motori libreria",s:"rosso",strato:"motori",nota:"design"},
 {n:"Mask Fast",s:"verde",strato:"interfaccia",nota:""},
 {n:"Mask Instant",s:"verde",strato:"interfaccia",nota:""},
 {n:"Dossier Fast",s:"verde",strato:"interfaccia",nota:"beta"},
 {n:"Dossier Instant/Full",s:"rosso",strato:"interfaccia",nota:"placeholder"},
 {n:"Sito landing",s:"giallo",strato:"interfaccia",nota:"parziale"},
 {n:"Sito 3 layer",s:"rosso",strato:"interfaccia",nota:""},
 {n:"Cockpit riservato",s:"giallo",strato:"interfaccia",nota:"v1"},
 {n:"JSON scaricabili",s:"verde",strato:"dati",nota:""},
 {n:"Database",s:"rosso",strato:"dati",nota:"il ponte"},
 {n:"GitHub",s:"verde",strato:"infra",nota:""},
 {n:"GitHub Pages",s:"verde",strato:"infra",nota:""},
 {n:"Docker/VPS/Backend",s:"rosso",strato:"infra",nota:""},
 {n:"Stripe/Squarespace/CDN",s:"rosso",strato:"servizi",nota:""},
 {n:"LLM API",s:"grigio",strato:"servizi",nota:"no dati personali"}
];
var COMMITS=[
 {h:"2f3e43d",dt:"28/07 00:23",s:"Cockpit: chiusa la check-list (allineamento a tre)"},
 {h:"3159e06",dt:"28/07 00:21",s:"Cockpit: riconciliata la relazione di ChatGPT"},
 {h:"596396d",dt:"28/07 00:16",s:"Cockpit: revisione operativa (comando, non scena)"},
 {h:"d220559",dt:"28/07 00:08",s:"Cockpit: adottato lo sfondo ufficiale"},
 {h:"6dafce4",dt:"28/07 00:06",s:"Discriminante piattaforma/prodotto: prodotti/tht-check/"},
 {h:"b6f1919",dt:"27/07 23:48",s:"Brief cockpit per ChatGPT"},
 {h:"667da8b",dt:"27/07 23:42",s:"Cockpit = verità viva: registro stati + regola"},
 {h:"f76223e",dt:"27/07 23:39",s:"Cockpit riservato v0: struttura"}
];
var TODO_APERTI=46;
var COL={verde:"#3fb765",giallo:"#e0b03a",rosso:"#d0574f",grigio:"#5a636e"};

/* gate */
var gate=document.getElementById('gate'),cockpit=document.getElementById('cockpit');
function unlock(){gate.style.display='none';cockpit.style.display='block';localStorage.setItem('tht_riservato','1');render();}
function tryPw(){document.getElementById('pw').value.trim()===PASSWORD?unlock():document.getElementById('err').textContent='Codice errato.';}
document.getElementById('enter').onclick=tryPw;
document.getElementById('pw').addEventListener('keydown',function(e){if(e.key==='Enter')tryPw();});
document.getElementById('logout').onclick=function(){localStorage.removeItem('tht_riservato');location.reload();};
if(localStorage.getItem('tht_riservato')==='1')unlock();

function arc(pct,color,label){
  var r=30,c=2*Math.PI*r,off=c*(1-pct/100),ticks='';
  for(var i=0;i<40;i++){var a=i/40*2*Math.PI-Math.PI/2,r1=35,r2=(i%5===0)?38:37;
    ticks+='<line x1="'+(40+Math.cos(a)*r1).toFixed(1)+'" y1="'+(40+Math.sin(a)*r1).toFixed(1)
      +'" x2="'+(40+Math.cos(a)*r2).toFixed(1)+'" y2="'+(40+Math.sin(a)*r2).toFixed(1)
      +'" stroke="'+(i%5===0?'#3a434e':'#20262e')+'" stroke-width="'+(i%5===0?1.2:.7)+'"/>';}
  return '<svg viewBox="0 0 80 80" width="90" height="90">'
   +'<circle cx="40" cy="40" r="39" fill="none" stroke="#161b21" stroke-width="2"/>'+ticks
   +'<circle cx="40" cy="40" r="30" fill="none" stroke="#1b2128" stroke-width="8"/>'
   +'<circle cx="40" cy="40" r="30" fill="none" stroke="'+color+'" stroke-width="8" stroke-linecap="round"'
   +' stroke-dasharray="'+c+'" stroke-dashoffset="'+off+'" transform="rotate(-90 40 40)" style="filter:drop-shadow(0 0 4px '+color+')"/>'
   +'<text x="40" y="40" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="800" fill="#e9ecef" font-family="ui-monospace,monospace">'+label+'</text></svg>';
}
function render(){
  var verdi=COMPONENTI.filter(function(x){return x.s==='verde';}).length,tot=COMPONENTI.length;
  var pct=Math.round(verdi/tot*100);
  document.getElementById('s-verdi').textContent=verdi+'/'+tot;
  document.getElementById('s-todo').textContent=TODO_APERTI;
  document.getElementById('g1').innerHTML=arc(pct,COL.verde,pct+'%');
  document.getElementById('g2').innerHTML=arc(33,COL.giallo,'1/3');
  document.getElementById('b-manca').textContent=(tot-verdi)+' + '+TODO_APERTI;
  // selettore prodotto
  var prods=[['Instant','densità 1','giallo'],['Fast','densità 2','verde'],['Full','densità 3','rosso']];
  document.getElementById('mode').innerHTML=prods.map(function(p,i){return '<button class="'+(i===1?'on':'')+'">'
    +'<div class="n"><span class="led" style="background:'+COL[p[2]]+'"></span>'+p[0]+'</div><div class="d">'+p[1]+'</div></button>';}).join('');
  // LED grid per strato
  var strati=[["motori","Motori"],["interfaccia","Interfaccia"],["dati","Dati"],["infra","Infra"],["servizi","Servizi"]];
  var h='';
  strati.forEach(function(st){
    h+='<div style="grid-column:1/-1" class="grid-t">'+st[1]+'</div>';
    COMPONENTI.filter(function(c){return c.strato===st[0];}).forEach(function(c){
      h+='<div class="led-c"><span class="dot '+c.s+'"></span><span class="nm">'+c.n+'</span>'
        +'<span class="st">'+(c.nota||c.s)+'</span></div>';
    });
  });
  document.getElementById('leds').innerHTML=h;
}
/* modali */
var modal=document.getElementById('modal');
function closeModal(){modal.style.display='none';document.documentElement.style.overflow='';document.body.style.overflow='';}
document.getElementById('mx').onclick=closeModal;
modal.onclick=function(e){if(e.target===modal)closeModal();};
function openModal(t,s,items){document.getElementById('m-title').textContent=t;document.getElementById('m-sub').textContent=s;
  document.getElementById('m-list').innerHTML=items;modal.style.display='flex';
  /* blocca lo scroll del fondo: cosi' sull'iPad scorre la LISTA, non il retinato dietro */
  document.documentElement.style.overflow='hidden';document.body.style.overflow='hidden';
  document.querySelector('#modal .card').scrollTop=0;}
document.getElementById('btn-manca').onclick=function(){
  var nonverdi=COMPONENTI.filter(function(x){return x.s!=='verde'&&x.s!=='grigio';});
  var items=nonverdi.map(function(c){return '<li style="border-left-color:'+COL[c.s]+'"><span class="dot '+c.s+'" style="align-self:center"></span>'+c.n+' <span class="dt">'+(c.nota||'')+'</span></li>';}).join('');
  items+='<li style="border-left-color:#c9b48a"><b>+ '+TODO_APERTI+' punti aperti</b> nel promemoria (da-fare.json) — da collegare live</li>';
  openModal('Nodi da risolvere','componenti non-verdi + promemoria · il revisore automatico',items);
};
document.getElementById('btn-lavoro').onclick=function(){
  var items=COMMITS.map(function(c){return '<li style="border-left-color:#6586A7"><span class="hash">'+c.h+'</span> '+c.s+'<span class="dt">'+c.dt+'</span></li>';}).join('');
  openModal('Registro attività','gli ultimi commit — cosa ho fatto',items);
};
</script>
</body>
</html>
